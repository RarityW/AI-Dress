version: '3.8'
services:
  api:
    build:
      context: ./apps/api
      dockerfile: ../../docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env

  web:
    build:
      context: ./apps/web
      dockerfile: ../../docker/Dockerfile.web
    ports:
      - "80:80"
    env_file:
      - .env
