version: '3.8'
services:
  api:
    build:
      context: ./apps/api
      dockerfile: ../../docker/Dockerfile.api
    volumes:
      - ./apps/api:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  web:
    build:
      context: ./apps/web
      dockerfile: ../../docker/Dockerfile.web
    volumes:
      - ./apps/web:/app
    ports:
      - "5173:5173"
    env_file:
      - .env
    command: npm run dev
